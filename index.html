<title>Polski dla mnie</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; color: #333;
  }
  .container { max-width: 700px; margin: 0 auto; padding: 16px; }
  header { text-align: center; color: white; padding: 20px 0; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 6px 0 0; opacity: 0.9; font-size: 14px; }

  .tabs {
    display: flex; overflow-x: auto; gap: 8px; padding: 10px 0;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; padding: 10px 16px;
    background: rgba(255,255,255,0.25); color: white;
    border: none; border-radius: 20px; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap;
  }
  .tab.active { background: white; color: #764ba2; }

  .card {
    background: white; border-radius: 20px; padding: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 16px;
  }
  .story-title { font-size: 22px; font-weight: 700; color: #764ba2; margin: 0 0 6px; }
  .story-subtitle { color: #888; font-size: 14px; margin: 0 0 16px; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .btn {
    flex: 1 1 auto; padding: 12px 16px; border: none; border-radius: 12px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-play { background: #667eea; color: white; }
  .btn-play:active { background: #5568d3; }
  .btn-slow { background: #8e9ef0; color: white; }
  .btn-stop { background: #e74c3c; color: white; }
  .btn-mic { background: #27ae60; color: white; }
  .btn-mic.listening { background: #e74c3c; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.7;} }

  .story-text { font-size: 19px; line-height: 1.9; color: #222; }
  .word { cursor: pointer; padding: 1px 2px; border-radius: 4px; transition: 0.15s; display: inline; }
  .word:active, .word.active { background: #ffe066; }

  .translation-box {
    margin-top: 16px; padding: 14px; background: #f4f6ff;
    border-left: 4px solid #667eea; border-radius: 10px;
    min-height: 60px; font-size: 16px; color: #333;
  }
  .translation-box .pl { font-weight: 700; color: #667eea; margin-bottom: 4px; }
  .translation-box .ru { color: #555; }
  .hint { color: #999; font-style: italic; font-size: 14px; }

  .full-translation {
    margin-top: 18px; font-size: 15px; line-height: 1.7; color: #555;
    display: none; padding: 14px; background: #fafafa; border-radius: 12px;
  }
  .full-translation.show { display: block; }
  .full-translation h3 { margin: 0 0 10px; color: #764ba2; font-size: 15px; }
  .full-translation p { margin: 0 0 8px; }

  .result {
    margin-top: 12px; padding: 12px; border-radius: 10px;
    font-size: 14px; display: none;
  }
  .result.show { display: block; }
  .result.ok { background: #d4edda; color: #155724; }
  .result.partial { background: #fff3cd; color: #856404; }
  .result.bad { background: #f8d7da; color: #721c24; }
  .recognized { margin-top: 8px; font-size: 13px; color: #666; font-style: italic; }

  .toggle-trans {
    background: transparent; border: 1px solid #667eea; color: #667eea;
    padding: 8px 14px; border-radius: 10px; font-size: 13px;
    margin-top: 14px; cursor: pointer;
  }
  .level-badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700; margin-left: 8px;
    background: #ffe066; color: #7a5a00;
  }
</style>

// ============ ЛОГИКА ============
let currentStory = 0;
let recognition = null;
let isListening = false;

const tabsEl = document.getElementById('tabs');
const cardEl = document.getElementById('card');

function normalize(word) {
  return word.toLowerCase().replace(/[.,!?;:—–\-„"()]/g, '').trim();
}

function translate(word) {
  const w = normalize(word);
  if (!w) return null;
  if (dict[w]) return dict[w];
  const variants = [w];
  if (w.endsWith('ie')) variants.push(w.slice(0,-2)+'a');
  if (w.endsWith('ę')) variants.push(w.slice(0,-1)+'a');
  if (w.endsWith('ą')) variants.push(w.slice(0,-1)+'a');
  if (w.endsWith('u')) variants.push(w.slice(0,-1));
  if (w.endsWith('em')) variants.push(w.slice(0,-2));
  if (w.endsWith('ami')) variants.push(w.slice(0,-3)+'a');
  if (w.endsWith('ego')) variants.push(w.slice(0,-3)+'y');
  if (w.endsWith('emu')) variants.push(w.slice(0,-3)+'y');
  if (w.endsWith('ych')) variants.push(w.slice(0,-3)+'y');
  if (w.endsWith('ym')) variants.push(w.slice(0,-2)+'y');
  if (w.endsWith('ej')) variants.push(w.slice(0,-2)+'a');
  for (const v of variants) if (dict[v]) return dict[v];
  return null;
}

function speak(text, rate=0.85) {
  if (!('speechSynthesis' in window)) { alert('Синтез речи не поддерживается'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'pl-PL';
  u.rate = rate;
  const voices = window.speechSynthesis.getVoices();
  const pl = voices.find(v => v.lang && v.lang.startsWith('pl'));
  if (pl) u.voice = pl;
  window.speechSynthesis.speak(u);
}

function buildStory(idx) {
  currentStory = idx;
  const story = stories[idx];

  tabsEl.innerHTML = '';
  stories.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i===idx ? ' active' : '');
    b.textContent = (i+1) + '. ' + s.title;
    b.onclick = () => buildStory(i);
    tabsEl.appendChild(b);
  });

  cardEl.innerHTML = `
    <h2 class="story-title">${story.title}</h2>
    <p class="story-subtitle">${story.subtitle}</p>

    <div class="controls">
      <button class="btn btn-play" id="playBtn">🔊 Читать</button>
      <button class="btn btn-slow" id="slowBtn">🐢 Медленно</button>
      <button class="btn btn-stop" id="stopBtn">⏹ Стоп</button>
    </div>
    <div class="controls">
      <button class="btn btn-mic" id="micBtn">🎤 Проверить моё чтение</button>
    </div>

    <div class="story-text" id="storyText"></div>

    <div class="translation-box" id="transBox">
      <span class="hint">👆 Нажми на любое слово — увидишь перевод и услышишь его</span>
    </div>

    <div class="result" id="result"></div>

    <button class="toggle-trans" id="toggleTrans">📖 Показать полный перевод</button>
    <div class="full-translation" id="fullTrans">
      <h3>Полный перевод:</h3>
      ${story.full.map(p => `<p>${p}</p>`).join('')}
    </div>
  `;

  const storyTextEl = document.getElementById('storyText');
  const tokens = story.text.split(/(\s+)/);
  tokens.forEach(tok => {
    if (/^\s+$/.test(tok)) { storyTextEl.appendChild(document.createTextNode(tok)); return; }
    const m = tok.match(/^([„"(\-—]*)([^\s.,!?;:—–\-„"()]+)([.,!?;:—–\-„"()]*)$/);
    if (!m) { storyTextEl.appendChild(document.createTextNode(tok)); return; }
    const [, pre, core, post] = m;
    if (pre) storyTextEl.appendChild(document.createTextNode(pre));
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = core;
    span.onclick = () => {
      document.querySelectorAll('.word.active').forEach(el => el.classList.remove('active'));
      span.classList.add('active');
      const tr = translate(core);
      const box = document.getElementById('transBox');
      box.innerHTML = `
        <div class="pl">🇵🇱 ${core}</div>
        <div class="ru">🇷🇺 ${tr ? tr : '— (нет в словаре)'}</div>
      `;
      speak(core, 0.8);
    };
    storyTextEl.appendChild(span);
    if (post) storyTextEl.appendChild(document.createTextNode(post));
  });

  document.getElementById('playBtn').onclick = () => speak(story.text, 0.9);
  document.getElementById('slowBtn').onclick = () => speak(story.text, 0.6);
  document.getElementById('stopBtn').onclick = () => window.speechSynthesis.cancel();
  document.getElementById('toggleTrans').onclick = (e) => {
    const el = document.getElementById('fullTrans');
    el.classList.toggle('show');
    e.target.textContent = el.classList.contains('show') ? '📕 Скрыть перевод' : '📖 Показать полный перевод';
  };
  document.getElementById('micBtn').onclick = () => startRecognition(story.text);
}

function startRecognition(expectedText) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const resultEl = document.getElementById('result');
  const micBtn = document.getElementById('micBtn');

  if (!SR) {
    resultEl.className = 'result bad show';
    resultEl.textContent = '⚠️ Распознавание не поддерживается. Используй Safari на iOS 14.5+ или Chrome.';
    return;
  }

  if (isListening) { recognition && recognition.stop(); return; }

  recognition = new SR();
  recognition.lang = 'pl-PL';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 3;

  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add('listening');
    micBtn.textContent = '🎙 Слушаю... нажми, чтобы остановить';
    resultEl.className = 'result';
    resultEl.textContent = '';
  };

  recognition.onerror = (e) => {
    isListening = false;
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤 Проверить моё чтение';
    resultEl.className = 'result bad show';
    resultEl.textContent = 'Ошибка: ' + e.error + '. Разреши доступ к микрофону в настройках Safari.';
  };

  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤 Проверить моё чтение';
  };

  recognition.onresult = (event) => {
    let heard = '';
    let bestScore = -1;
    for (let i = 0; i < event.results.length; i++) {
      for (let j = 0; j < event.results[i].length; j++) {
        const alt = event.results[i][j];
        const score = alt.confidence || 0.5;
        if (score > bestScore) { bestScore = score; heard = alt.transcript; }
      }
    }
    compareAndShow(expectedText, heard, resultEl);
  };

  try { recognition.start(); }
  catch(e) {
    resultEl.className = 'result bad show';
    resultEl.textContent = 'Не удалось запустить распознавание: ' + e.message;
  }
}

function compareAndShow(expected, heard, resultEl) {
  const cleanExp = expected.toLowerCase().replace(/[.,!?;:—–\-„"()\n]/g, ' ').split(/\s+/).filter(Boolean);
  const cleanHeard = heard.toLowerCase().replace(/[.,!?;:—–\-„"()\n]/g, ' ').split(/\s+/).filter(Boolean);

  // простая оценка по совпадению слов
  let matched = 0;
  const used = new Array(cleanHeard.length).fill(false);
  cleanExp.forEach(w => {
    for (let i = 0; i < cleanHeard.length; i++) {
      if (!used[i] && (cleanHeard[i] === w || levenshtein(cleanHeard[i], w) <= 1)) {
        used[i] = true; matched++; break;
      }
    }
  });
  const pct = Math.round(matched / cleanExp.length * 100);

  let cls = 'bad', emoji = '😕', msg = '';
  if (pct >= 85) { cls = 'ok'; emoji = '🎉'; msg = 'Отлично! Почти идеально!'; }
  else if (pct >= 60) { cls = 'partial'; emoji = '👍'; msg = 'Неплохо, но есть ошибки.'; }
  else { cls = 'bad'; emoji = '📚'; msg = 'Попробуй ещё раз, читай медленнее.'; }

  resultEl.className = 'result ' + cls + ' show';
  resultEl.innerHTML = `${emoji} <b>${pct}%</b> — ${msg}
    <div class="recognized">📝 Я услышал: "${heard}"</div>`;
}

function levenshtein(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  const m = [];
  for (let i = 0; i <= b.length; i++) m[i] = [i];
  for (let j = 0; j <= a.length; j++) m[0][j] = j;
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      m[i][j] = b[i-1] === a[j-1]
        ? m[i-1][j-1]
        : Math.min(m[i-1][j-1]+1, m[i][j-1]+1, m[i-1][j]+1);
    }
  }
  return m[b.length][a.length];
}

// загрузка голосов
if ('speechSynthesis' in window) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

buildStory(0);
</script>
